<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRROR Systems</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #07111f;
            color: #d8f3ff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .panel {
            width: min(600px, 85vw);
            padding: 40px;
            border: 1px solid #26b7ff;
            background: #0c1a2b;
            box-shadow: 0 0 30px rgba(38, 183, 255, 0.2);
            text-align: center;
        }

        h1 {
            color: #67d3ff;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .system {
            font-family: monospace;
            color: #8de1ff;
            margin-top: 30px;
        }

        .warning {
            margin-top: 30px;
            color: #9baebc;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

<div class="panel">

    <h1>MIRROR</h1>
    <h2>AI Research Facility</h2>

    <div class="system">
        FACILITY DOCUMENTATION SYSTEM
    </div>

    <p>
        No document identifier was provided.
    </p>

    <p>
        Scan an authorized facility QR code
        to access the requested resource.
    </p>

    <div class="warning">
        Access to MIRROR facility systems is restricted
        to authorized personnel.
    </div>

</div>

</body>
</html>
